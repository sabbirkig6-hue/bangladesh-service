<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#f5f7fb;color:#111}
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,#0a66ff,#00a8ff);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.topbar b{font-size:17px;flex:1}
.iconBtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;border:0;color:#fff;font-weight:800;font-size:17px;cursor:pointer;overflow:hidden}
.iconBtn img{width:100%;height:100%;object-fit:cover}
.app-section{display:none;padding:12px 12px 90px;max-width:800px;margin:0 auto}
.app-section.active{display:block}
.searchWrap{background:#fff;padding:10px 14px;border-radius:16px;display:flex;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,.06);margin:8px 0 14px}
.searchWrap input{border:0;outline:none;width:100%;font-size:15px}
.hero{background:#fff;border-radius:18px;padding:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.06)}
.catGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.cat{position:relative;background:#fff;border-radius:18px;padding:16px 10px;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(10,102,255,.08);border:1px solid #eef2ff;cursor:pointer}
.cat .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;margin-bottom:8px}
.cat .name{font-weight:800;font-size:14px;text-align:center}
.cat .count{position:absolute;top:8px;right:8px;background:#0a66ff;color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e8ecf5;display:flex;justify-content:space-around;padding:8px 0;z-index:30}
.nav button{border:0;background:0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#6b7280;cursor:pointer}
.nav button.active{color:#0a66ff;font-weight:900}
.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(0,0,0,.05);display:flex;gap:10px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:#e6efff;display:grid;place-items:center;font-weight:900;color:#0a66ff;flex-shrink:0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.b1{background:#eef2ff;color:#0a66ff}
.b2{background:#0a66ff;color:#fff;width:100%}
.danger{background:#ffe8e8;color:#c62828}
.formCard{background:#fff;border-radius:18px;padding:16px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
.formCard input,.formCard select,.formCard textarea{width:100%;padding:13px 14px;border:1px solid #dbe2f5;border-radius:12px;margin-top:10px;font-size:14px;outline:none}
.page{position:fixed;inset:0;background:#f5f7fb;z-index:60;display:none;flex-direction:column;overflow:auto}
.profileHeader{background:linear-gradient(180deg,#0a66ff 60%,#f5f7fb 60%);padding:18px;text-align:center}
.profilePic{width:96px;height:96px;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.18);object-fit:cover;background:#fff}
.loginCard{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
.small{font-size:12px;color:#6b7280}
</style>

let providers=[];
let currentServiceType="";
let currentUser=null;

function isAdmin(){
return !!(
auth.currentUser &&
auth.currentUser.email &&
auth.currentUser.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()
);
}

function escapeHTML(value){
return String(value??"").replace(/[&<>"']/g,function(c){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c];
});
}

function hideAllSections(){
document.querySelectorAll(".app-section").forEach(e=>e.classList.remove("active"));
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
}

function goHome(){
$("page-service").style.display="none";
hideAllSections();
$("page-home").classList.add("active");
$("nav-home").classList.add("active");
}

function goPage(n){
$("page-service").style.display="none";
hideAllSections();
let s=$("page-"+n);
if(s)s.classList.add("active");
let nav=$("nav-"+n);
if(nav)nav.classList.add("active");
}

function getCount(t){
return providers.filter(p=>p.type===t).length;
}

function initCats(){
let h="";

for(let s of SERVICES){
h+='<div class="cat" data-type="'+s[0]+'">'+
'<span class="count">'+getCount(s[0])+'</span>'+
'<div class="ico" style="background:'+s[3]+'">'+s[2]+'</div>'+
'<div class="name">'+s[1]+'</div></div>';
}

$("catBox").innerHTML=h;

document.querySelectorAll(".cat").forEach(el=>{
el.addEventListener("click",function(){
openServicePage(this.getAttribute("data-type"));
});
});

$("fType").innerHTML=SERVICES.map(s=>
'<option value="'+s[0]+'">'+s[1]+'</option>'
).join("");

$("totalCount").textContent=providers.length+" জন";
}

function openServicePage(t){
let svc=SERVICES.find(x=>x[0]===t);
if(!svc)return;

currentServiceType=t;
$("serviceTitle").textContent=svc[1];
$("serviceSearchBox").value="";
$("page-service").style.display="flex";
renderServicePage();
}

function closeServicePage(){
$("page-service").style.display="none";
}

function renderServicePage(){
let q=($("serviceSearchBox").value||"").toLowerCase();

let list=providers.filter(p=>{
if(p.type!==currentServiceType)return false;
if(!q)return true;

return (
(p.name||"")+" "+
(p.address||"")+" "+
(p.phone||"")+" "+
(p.details||"")
).toLowerCase().includes(q);
});

$("serviceCount").textContent=list.length+" জন";

let html="";

for(let p of list){
let ini=escapeHTML((p.name||"B").trim().charAt(0).toUpperCase());
let phone=String(p.phone||"").replace(/[^0-9]/g,"");
let waNumber=phone.startsWith("0")?"88"+phone:phone;
let callLink="tel:"+phone;
let waLink="https://wa.me/"+waNumber;

html+='<div class="card" style="flex-direction:column;align-items:stretch">'+
'<div style="display:flex;gap:10px;align-items:center">'+
'<div class="avatar">'+ini+'</div>'+
'<div style="flex:1"><b>'+escapeHTML(p.name)+'</b><br>'+
'<small>📍 '+escapeHTML(p.address)+'</small><br>'+
'<small>📞 '+escapeHTML(p.phone)+'</small></div></div>'+
'<div style="background:#f5f7fb;border-radius:12px;padding:10px;margin-top:8px;font-size:13px">'+
escapeHTML(p.details||"বিবরণ নাই")+'</div>'+
'<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">'+
'<a href="'+callLink+'" style="flex:1;text-decoration:none"><button class="btn b2" style="width:100%">📞 কল করুন</button></a>'+
'<a href="'+waLink+'" target="_blank" rel="noopener" style="flex:1;text-decoration:none"><button class="btn b1" style="width:100%">💬 WhatsApp</button></a>';

if(isAdmin()){
html+='<button class="btn danger" onclick="deleteProvider(\''+p.fbId+'\')">🗑️ ডিলিট</button>';
}

html+='</div></div>';
}

$("serviceProviderCards").innerHTML=html||
'<div style="padding:24px;text-align:center;color:#6b7280">এখনো কেউ নেই</div>';
}

async function deleteProvider(fbId){
if(!isAdmin()){
alert("শুধু অ্যাডমিন আবেদন ডিলিট করতে পারবেন।");
return;
}

if(!confirm("আপনি কি এই আবেদনটি ওয়েবসাইট থেকে ডিলিট করতে চান?"))return;

try{
await db.ref("providers/"+fbId).remove();
alert("আবেদনটি ওয়েবসাইট থেকে ডিলিট হয়েছে।");
}catch(e){
alert("ডিলিট করা যায়নি: "+e.message);
}
}

db.ref("providers").on("value",snap=>{
const val=snap.val();
providers=[];

if(val){
Object.keys(val).forEach(k=>{
providers.push({...val[k],fbId:k});
});
}

initCats();

if(currentServiceType)renderServicePage();

},error=>{
console.error(error);
});

$("searchBox").addEventListener("input",function(){
let q=this.value.toLowerCase();

document.querySelectorAll(".cat").forEach(el=>{
let t=el.getAttribute("data-type");
let s=SERVICES.find(x=>x[0]===t);
let name=s?s[1].toLowerCase():"";

el.style.display=name.includes(q)||t.includes(q)?"flex":"none";
});
});

$("serviceSearchBox").addEventListener("input",renderServicePage);

$("btnBackService").addEventListener("click",closeServicePage);
$("btnCloseService").addEventListener("click",closeServicePage);

$("nav-home").addEventListener("click",goHome);

$("nav-account").addEventListener("click",()=>goPage("account"));

$("topLoginBtn").addEventListener("click",()=>goPage("login"));

$("headerProfilePic").addEventListener("click",()=>{
goPage("account");
});

async function googleLogin(){
try{
let provider=new firebase.auth.GoogleAuthProvider();
await auth.signInWithPopup(provider);
goHome();
}catch(e){
alert("লগইন সমস্যা: "+e.message);
}
}

$("btnGoogle").addEventListener("click",googleLogin);
$("accountGoogleBtn").addEventListener("click",googleLogin);

$("btnLogout").addEventListener("click",async()=>{
try{
await auth.signOut();
goHome();
}catch(e){
alert(e.message);
}
});

auth.onAuthStateChanged(async u=>{
currentUser=u;

if(u){
$("topLoginBtn").style.display="none";

$("headerProfilePic").innerHTML=u.photoURL
?'<img src="'+escapeHTML(u.photoURL)+'" alt="Profile">'
:escapeHTML((u.displayName||"P").charAt(0).toUpperCase());

$("profilePic").src=u.photoURL||"https://i.pravatar.cc/200?u="+u.uid;
$("profileNameText").textContent=u.displayName||"ব্যবহারকারী";
$("pEmail").value=u.email||"";
$("accountLoginMsg").textContent="আপনি লগইন করেছেন।";

try{
const snap=await db.ref("profiles/"+u.uid).once("value");
const p=snap.val()||{};

$("pName").value=p.name||u.displayName||"";
$("pPhone").value=p.phone||"";
$("pAddress").value=p.address||"";
}catch(e){
console.log(e);
}

}else{
$("topLoginBtn").style.display="grid";
$("headerProfilePic").textContent="👤";

$("profilePic").src="https://i.pravatar.cc/200?u=guest";
$("profileNameText").textContent="অতিথি";
$("pName").value="";
$("pEmail").value="";
$("pPhone").value="";
$("pAddress").value="";
$("accountLoginMsg").textContent="প্রোফাইল ব্যবহার করতে Google দিয়ে লগইন করুন।";
}

if(currentServiceType)renderServicePage();
});

$("btnSubmit").addEventListener("click",async()=>{
const u=auth.currentUser;

if(!u){
$("formMsg").style.color="red";
$("formMsg").textContent="আবেদন জমা দিতে আগে Google দিয়ে লগইন করুন।";
goPage("login");
return;
}

const data={
type:$("fType").value,
name:$("fName").value.trim(),
address:$("fAddr").value.trim(),
phone:$("fPhone").value.trim(),
details:$("fDetails").value.trim(),
ownerUid:u.uid,
createdAt:Date.now()
};

if(!data.name||!data.phone){
$("formMsg").style.color="red";
$("formMsg").textContent="নাম ও ফোন নম্বর দিন।";
return;
}

$("btnSubmit").disabled=true;
$("formMsg").style.color="#0a66ff";
$("formMsg").textContent="আবেদন জমা হচ্ছে...";

try{
await db.ref("providers").push(data);

$("formMsg").style.color="green";
$("formMsg").textContent="আবেদন সফলভাবে জমা হয়েছে!";

$("fName").value="";
$("fPhone").value="";
$("fAddr").value="";
$("fDetails").value="";

setTimeout(()=>goHome(),1200);

}catch(e){
$("formMsg").style.color="red";
$("formMsg").textContent="সমস্যা হয়েছে: "+e.message;
}finally{
$("btnSubmit").disabled=false;
}
});

$("btnSaveProfile").addEventListener("click",async()=>{
const u=auth.currentUser;

if(!u){
alert("আগে Google দিয়ে লগইন করুন।");
return;
}

const profile={
name:$("pName").value.trim(),
email:u.email||"",
phone:$("pPhone").value.trim(),
address:$("pAddress").value.trim()
};

try{
await db.ref("profiles/"+u.uid).set(profile);
$("profileNameText").textContent=profile.name||u.displayName||"ব্যবহারকারী";
alert("প্রোফাইল সেভ হয়েছে।");
}catch(e){
alert("সেভ হয়নি: "+e.message);
}
});

initCats();
</script>
</body>
</html>
